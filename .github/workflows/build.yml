name: Build GNU Radio blocks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU Radio and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ gnuradio-dev libusb-1.0-0-dev pybind11-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
      - name: Build library and Python bindings
        run: cmake --build build --parallel 2
